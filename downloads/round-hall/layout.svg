深1000 / 外弦3861 / 三座</text><text x="1422" y="644" font-size="23" font-weight="400" fill="#73756b">沙发后留约500；非主通道</text><text x="1422" y="700" font-size="27" font-weight="600" fill="#272a25">03  摆位与通行</text><text x="1422" y="740" font-size="23" font-weight="400" fill="#73756b">A桌沙发净距：角点440 / 中580</text><text x="1422" y="776" font-size="23" font-weight="400" fill="#73756b">B圆桌—沙发最近约450 mm</text><text x="1422" y="812" font-size="23" font-weight="400" fill="#73756b">茶几—单椅约500 mm</text><text x="1422" y="848" font-size="23" font-weight="400" fill="#73756b">西南主通道建议≥1200 mm</text><text x="1422" y="904" font-size="27" font-weight="600" fill="#272a25">04  灯具与层高</text><text x="1422" y="944" font-size="23" font-weight="400" fill="#73756b">壁灯组中心高约1900 mm</text><text x="1422" y="980" font-size="23" font-weight="400" fill="#73756b">灯组贴曲墙，避开双窗</text><text x="1422" y="1016" font-size="23" font-weight="400" fill="#73756b">当前低顶2890 mm，待实测</text><text x="1422" y="1072" font-size="27" font-weight="600" fill="#272a25">尺寸与采购说明</text><text x="1422" y="1112" font-size="23" font-weight="400" fill="#73756b">此图用于软装布局与比例核对。</text><text x="1422" y="1148" font-size="23" font-weight="400" fill="#73756b">模型、图纸与定制尺寸需复核。</text><text x="1422" y="1184" font-size="23" font-weight="400" fill="#73756b">家具定制须由厂家出生产图。</text><path d="M95 1360H445M95 1350V1370M270 1350V1370M445 1350V1370" stroke="#676f64" stroke-width="3"/><text x="95" y="1400" class="small">0</text><text x="258" y="1400" class="small">1</text><text x="430" y="1400" class="small">2 m</text><text x="680" y="1415" class="small">Y-up / X=CAD X，Z=-CAD Y · 数值单位mm（坐标见JSON）</text></svg>